{% extends 'base.html' %}

{% block head %}
    <title>Projects - Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/projects.css')}}">
{% endblock %}

{% block content %}

<h2>Projects</h2>
{% if projects %}
    <div id="projects">
        {% for project in projects %}
        <div class="project">
            <a href="{{ url_for('project.project', id=project.id) }}">{{ project.name }}</a>
        </div>
        {% endfor %}
    </div>
{% else %}
    <p>No projects found. Start by creating a new project!</p>
{% endif %}

{% endblock %}
